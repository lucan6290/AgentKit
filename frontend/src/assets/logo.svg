<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ak-bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4783f6"/>
      <stop offset="100%" stop-color="#1e4fb8"/>
    </linearGradient>
    <linearGradient id="ak-sheen" x1="32" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#ak-bg)"/>
  <rect x="3" y="3" width="58" height="30" rx="14" fill="url(#ak-sheen)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Stylized "AK" with shared vertical spine, node connection motif -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: two legs + crossbar -->
    <path d="M14 47 L24 17 L34 47"/>
    <path d="M17 37 L31 37"/>
    <!-- K: vertical stem (continues from A's right leg visually) + arms from hub -->
    <path d="M29 47 L29 24"/>
    <path d="M29 32 L46 17"/>
    <path d="M29 32 L46 47"/>
  </g>
  <!-- Connection hub at K vertex -->
  <circle cx="29" cy="32" r="4" fill="#ffffff"/>
  <circle cx="29" cy="32" r="1.8" fill="#3b79f0"/>
</svg>
