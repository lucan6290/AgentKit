<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   品牌设计系统 — 语义化令牌
   ============================================================ */
:root{
  /* 品牌：Emerald + Slate */
  --bg:#f6f7f9;
  --bg-alt:#eef0f3;
  --surface:#ffffff;
  --surface-2:#f0f2f5;

  --fg:#0f172a;
  --fg-muted:#475569;
  --fg-subtle:#94a3b8;

  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --primary-soft:rgba(37,99,235,.08);
  --primary-glow:rgba(37,99,235,.25);
  --primary-gradient:linear-gradient(135deg,#3b82f6,#1d4ed8);

  --border:rgba(15,23,42,.08);
  --border-hover:rgba(15,23,42,.14);

  --radius:16px;
  --radius-sm:10px;
  --radius-lg:24px;

  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  --shadow-lg:0 24px 56px -20px rgba(15,23,42,.18);

  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  --font-mono:'Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;

  --grid-line:rgba(15,23,42,.04);
  --hero-glow:radial-gradient(600px 400px at 50% 0%,rgba(37,99,235,.06),transparent 70%);

  /* 更新类型颜色 */
  --change-feature:#2563eb;
  --change-fix:#d97706;
  --change-improve:#2563eb;

  /* 版本标签颜色 */
  --badge-stable-bg:rgba(8,145,178,.12);
  --badge-stable-fg:#0891b2;
  --badge-patch-bg:rgba(217,119,6,.12);
  --badge-patch-fg:#d97706;
  --badge-release-bg:rgba(124,58,237,.12);
  --badge-release-fg:#7c3aed;
  --badge-beta-bg:rgba(225,29,72,.12);
  --badge-beta-fg:#e11d48;
}
.dark{
  --bg:#0a0f1a;
  --bg-alt:#0f1623;
  --surface:#141c2b;
  --surface-2:#1a2335;

  --fg:#e2e8f0;
  --fg-muted:#94a3b8;
  --fg-subtle:#64748b;

  --primary:#60a5fa;
  --primary-hover:#93c5fd;
  --primary-soft:rgba(96,165,250,.12);
  --primary-glow:rgba(96,165,250,.3);
  --primary-gradient:linear-gradient(135deg,#3b82f6,#60a5fa);

  --border:rgba(255,255,255,.08);
  --border-hover:rgba(255,255,255,.14);

  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow:0 1px 3px rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.4);
  --shadow-lg:0 24px 56px -20px rgba(0,0,0,.5);

  --grid-line:rgba(255,255,255,.04);
  --hero-glow:radial-gradient(600px 400px at 50% 0%,rgba(96,165,250,.08),transparent 70%);

  --change-feature:#60a5fa;
  --change-fix:#fbbf24;
  --change-improve:#3b82f6;

  --badge-stable-bg:rgba(34,211,238,.12);
  --badge-stable-fg:#22d3ee;
  --badge-patch-bg:rgba(251,191,36,.12);
  --badge-patch-fg:#fbbf24;
  --badge-release-bg:rgba(167,139,250,.12);
  --badge-release-fg:#a78bfa;
  --badge-beta-bg:rgba(251,113,133,.12);
  --badge-beta-fg:#fb7185;
}

/* ============================================================
   Reset
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--font-sans);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--primary-soft)}
.container{width:min(100% - 48px,1120px);margin:0 auto}

/* ============================================================
   导航
   ============================================================ */
.nav{position:sticky;top:0;z-index:200;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;height:60px;gap:16px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--fg);white-space:nowrap}
.nav-logo{width:28px;height:28px;border-radius:8px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 12px var(--primary-glow);transition:transform .2s}
.nav-brand:hover .nav-logo{transform:scale(1.08) rotate(-4deg)}
.nav-links{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-links a{font-size:13px;color:var(--fg-muted);padding:6px 10px;border-radius:7px;white-space:nowrap;transition:background .15s,color .15s}
.nav-links a:hover{background:var(--primary-soft);color:var(--primary)}
.nav-links a.active{color:var(--primary);background:var(--primary-soft);font-weight:600}
.nav-cta{font-size:13px;padding:7px 14px;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px -4px var(--primary-glow);transition:background .2s,transform .2s}
.nav-cta:hover{background:var(--primary-hover);transform:translateY(-1px)}
/* 导航内工具区 */
.nav-tools{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--border)}
/* 配色下拉选择器 */
.theme-picker{position:relative}
.theme-picker-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);cursor:pointer;font-size:12px;transition:background .15s,border-color .15s,color .15s}
.theme-picker-btn:hover{border-color:var(--primary);color:var(--primary)}
.theme-picker-btn .swatch{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:transform .15s}
.theme-picker-btn .caret{transition:transform .2s}
.theme-picker.open .caret{transform:rotate(180deg)}
.theme-picker-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:300;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility .2s}
.theme-picker.open .theme-picker-menu{opacity:1;visibility:visible;transform:translateY(0)}
.theme-picker-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:12px;color:var(--fg-muted);cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.theme-picker-item:hover{background:var(--primary-soft);color:var(--fg)}
.theme-picker-item.active{color:var(--primary);font-weight:600}
.theme-picker-item .swatch{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.theme-picker-item.active .swatch{border-color:var(--fg)}
.theme-picker-item .check{margin-left:auto;opacity:0;color:var(--primary)}
.theme-picker-item.active .check{opacity:1}
.dark-toggle{font-size:13px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;justify-content:center}
.dark-toggle:hover{color:var(--primary);border-color:var(--primary)}
.lang-toggle{font-size:12px;font-weight:600;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.lang-toggle:hover{color:var(--primary);border-color:var(--primary)}
.github-link{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;justify-content:center}
.github-link:hover{color:var(--primary);border-color:var(--primary)}

/* ============================================================
   Hero
   ============================================================ */
.hero{padding:80px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--hero-glow);pointer-events:none}
.hero-bg-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);pointer-events:none}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 15%,transparent);padding:5px 12px;border-radius:999px;margin-bottom:20px;animation:fadeUp .6s ease both}
.hero-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulse 2s ease-in-out infinite}
.hero h1{font-size:clamp(36px,5.2vw,56px);font-weight:800;line-height:1.06;letter-spacing:-.035em;margin-bottom:16px;color:var(--fg);animation:fadeUp .6s .1s ease both}
.hero h1 em{font-style:normal;background:var(--primary-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:17px;color:var(--fg-muted);line-height:1.7;margin-bottom:28px;max-width:580px;animation:fadeUp .6s .2s ease both}
.hero-stats{display:flex;gap:32px;animation:fadeUp .6s .4s ease both}
.hero-stat .num{font-size:22px;font-weight:800;color:var(--fg);font-family:var(--font-mono)}
.hero-stat .label{font-size:11px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.06em}

/* ============================================================
   Section 通用
   ============================================================ */
.section{padding:88px 0;position:relative}
.section.alt{background:var(--bg-alt)}
.section-header{text-align:center;margin:0 auto 48px;max-width:640px}
.section-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--primary);text-transform:uppercase;background:var(--primary-soft);padding:4px 11px;border-radius:999px;margin-bottom:12px}
.section-title{font-size:clamp(28px,3.5vw,40px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:10px;color:var(--fg)}
.section-desc{font-size:15px;color:var(--fg-muted);max-width:520px;margin:0 auto}

/* ============================================================
   更新日志 — 筛选按钮
   ============================================================ */
.filter-bar{display:flex;justify-content:center;gap:8px;margin-bottom:48px;flex-wrap:wrap}
.filter-btn{font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .15s;font-weight:500}
.filter-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:transparent;font-weight:600}
.filter-btn:active{transform:translateY(0)!important}

/* ============================================================
   更新日志 — 时间线
   ============================================================ */
.timeline{position:relative;max-width:820px;margin:0 auto}
/* 垂直连线 */
.timeline::before{content:'';position:absolute;left:15px;top:12px;bottom:12px;width:2px;background:linear-gradient(to bottom,var(--primary) 0%,var(--border) 100%)}
/* 时间线条目 */
.timeline-item{position:relative;padding-left:56px;margin-bottom:32px}
.timeline-item:last-child{margin-bottom:0}
/* 时间线圆点 */
.timeline-dot{position:absolute;left:0;top:24px;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);z-index:1;box-shadow:0 0 0 4px var(--bg),0 4px 12px var(--primary-glow);transition:transform .2s,box-shadow .2s}
.timeline-item:hover .timeline-dot{transform:scale(1.15);box-shadow:0 0 0 4px var(--bg),0 6px 20px var(--primary-glow)}
/* 版本卡片 */
.version-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);transition:border-color .25s,box-shadow .25s,transform .25s}
.version-card:hover{border-color:var(--border-hover);box-shadow:var(--shadow);transform:translateY(-2px)}
/* 版本头部 */
.version-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.version-number{font-size:20px;font-weight:800;color:var(--fg);font-family:var(--font-mono);letter-spacing:-.02em}
.version-date{font-size:13px;color:var(--fg-subtle);margin-left:auto}
/* 版本标签 */
.version-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.version-badge.latest{background:var(--primary-soft);color:var(--primary)}
.version-badge.stable{background:var(--badge-stable-bg);color:var(--badge-stable-fg)}
.version-badge.patch{background:var(--badge-patch-bg);color:var(--badge-patch-fg)}
.version-badge.release{background:var(--badge-release-bg);color:var(--badge-release-fg)}
.version-badge.beta{background:var(--badge-beta-bg);color:var(--badge-beta-fg)}
/* 更新分类 */
.change-group{margin-bottom:16px}
.change-group:last-child{margin-bottom:0}
.change-group-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:8px}
.change-group-title.feature{color:var(--change-feature)}
.change-group-title.fix{color:var(--change-fix)}
.change-group-title.improve{color:var(--change-improve)}
.change-icon{font-size:15px;line-height:1}
.change-list{list-style:none;padding:0}
.change-list li{font-size:13px;color:var(--fg-muted);padding:5px 0 5px 16px;position:relative;line-height:1.6}
.change-list.feature li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--change-feature)}
.change-list.fix li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--change-fix)}
.change-list.improve li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--change-improve)}
/* 无结果提示 */
.no-results{text-align:center;padding:64px 0;color:var(--fg-subtle);font-size:15px}

/* ============================================================
   Footer
   ============================================================ */
footer{background:var(--bg-alt);border-top:1px solid var(--border);padding:56px 0 32px}
.footer-inner{display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px}
.footer-brand{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.footer-brand .nav-logo{width:26px;height:26px;font-size:12px}
.footer-desc{font-size:13px;color:var(--fg-muted);max-width:360px;line-height:1.6}
.footer-col h4{font-size:12px;color:var(--fg);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.footer-col a{display:block;font-size:13px;color:var(--fg-muted);padding:3px 0;transition:color .15s}
.footer-col a:hover{color:var(--primary)}
.footer-bottom{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--fg-subtle)}

/* ============================================================
   动画
   ============================================================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ============================================================
   交互状态细节
   ============================================================ */
.filter-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.nav-links a.active{color:var(--primary);background:var(--primary-soft);font-weight:600}
/* 返回顶部 */
.scroll-top{position:fixed;bottom:28px;right:28px;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-muted);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:150}
.scroll-top.visible{opacity:1;pointer-events:auto}
.scroll-top:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.scroll-top:active{transform:translateY(0)!important}

/* ============================================================
   响应式
   ============================================================ */
@media(max-width:820px){
  .nav-links{display:none}
  .footer-inner{grid-template-columns:1fr;gap:24px}
  .hero-stats{gap:20px}
  .nav-brand{font-size:13px}
  .nav-cta{display:none}
  .nav-tools{gap:6px;padding-left:8px}
}
@media(max-width:640px){
  .container{width:calc(100% - 24px)}
  .hero{padding:56px 0 40px}
  .section{padding:56px 0}
  .timeline-item{padding-left:44px}
  .timeline-dot{width:28px;height:28px;top:20px}
  .timeline::before{left:13px}
  .version-header{flex-direction:column;align-items:flex-start;gap:6px}
  .version-date{margin-left:0}
  .version-card{padding:18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

          </div>
          <div class="theme-picker-item" data-color="amber" role="menuitem" tabindex="0">
            <span class="swatch" style="background:#d97706"></span><span data-i18n="theme.amber">琥珀</span>
            <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="theme-picker-item" data-color="rose" role="menuitem" tabindex="0">
            <span class="swatch" style="background:#e11d48"></span><span data-i18n="theme.rose">玫红</span>
            <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>

          <div class="theme-picker-item" data-color="cyan" role="menuitem" tabindex="0">
            <span class="swatch" style="background:#0891b2"></span><span data-i18n="theme.cyan">青色</span>
            <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="theme-picker-item" data-color="violet" role="menuitem" tabindex="0">
            <span class="swatch" style="background:#7c3aed"></span><span data-i18n="theme.violet">紫罗兰</span>
            <svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
        </div>

<script>
(function(){
  'use strict';

  /* ============ 中英文国际化 (i18n) ============ */
  var i18nDict={
    en:{
      'nav.brand':'AgentKit','nav.home':'Home','nav.docs':'Docs','nav.guide':'Guide','nav.changelog':'Changelog','nav.sponsors':'Sponsors','nav.freeDownload':'Free Download','nav.download':'Download',
      'nav.features':'Features','nav.demo':'Demo','nav.install':'Install','nav.tech':'Tech Stack',
      'theme.emerald':'Blue','theme.indigo':'Indigo','theme.amber':'Amber','theme.rose':'Rose','theme.cyan':'Cyan','theme.violet':'Violet',
      'changelog.eyebrow':'Version History · v0.3.1 Latest','changelog.title':'Change<em>log</em>','changelog.desc':'Track all version updates, feature improvements, and bug fixes — see how the product evolves.',
      'changelog.statVersions':'Releases','changelog.statFeatures':'New Features','changelog.statFixes':'Bug Fixes',
      'changelog.filterAll':'All','changelog.filterLatest':'Latest','changelog.filterStable':'Stable','changelog.filterHistory':'History',
      'changelog.noResults':'No versions match this filter.',
      'footer.desc':'A cross-platform desktop app to manage AI Agent Skills and sync them across 44 AI coding tools.',
      'footer.product':'Product','footer.resources':'Resources',
      'footer.github':'GitHub Repo','footer.releases':'Releases','footer.issues':'Feedback','footer.docs':'Documentation',
      'footer.copyright':'© 2026 AgentKit Community · MIT License · Open Source'
    }
  };
  var currentLang='zh';

  function applyI18n(){
    if(currentLang==='en'){
      /* data-i18n: 替换文本内容 */
      document.querySelectorAll('[data-i18n]').forEach(function(el){
        var key=el.getAttribute('data-i18n');
        if(i18nDict.en[key]){el.textContent=i18nDict.en[key]}
      });
      /* data-i18n-html: 替换 HTML 内容（含 <br><em> 等） */
      document.querySelectorAll('[data-i18n-html]').forEach(function(el){
        var key=el.getAttribute('data-i18n-html');
        if(i18nDict.en[key]){el.innerHTML=i18nDict.en[key]}
      });
      /* 更新 langLabel */
      var langLabel=document.getElementById('langLabel');
      if(langLabel)langLabel.textContent='中';
      /* 更新 HTML lang */
      document.documentElement.lang='en';
      /* 更新配色选择器显示 */
      updatePickerDisplay(currentTheme);
    }else{
      /* 恢复中文：重新加载页面最可靠 */
      location.reload();
    }
  }

  /* 从 localStorage 恢复语言偏好 */
  try{var savedLang=localStorage.getItem('site-lang');if(savedLang==='en'){currentLang='en'}}catch(e){}
  /* 如果保存的是英文，延迟应用（等 DOM 就绪） */
  if(currentLang==='en'){
    document.addEventListener('DOMContentLoaded',function(){applyI18n()});
  }

  /* ============ 主题配色切换 ============ */
  var themes={
    emerald:{
      light:{'--primary':'#2563eb','--primary-hover':'#1d4ed8','--primary-soft':'rgba(37,99,235,.08)','--primary-glow':'rgba(37,99,235,.25)','--primary-gradient':'linear-gradient(135deg,#3b82f6,#1d4ed8)'},
      dark:{'--primary':'#60a5fa','--primary-hover':'#93c5fd','--primary-soft':'rgba(96,165,250,.12)','--primary-glow':'rgba(96,165,250,.3)','--primary-gradient':'linear-gradient(135deg,#3b82f6,#60a5fa)'}
    },
    indigo:{
      light:{'--primary':'#4f46e5','--primary-hover':'#4338ca','--primary-soft':'rgba(79,70,229,.08)','--primary-glow':'rgba(79,70,229,.25)','--primary-gradient':'linear-gradient(135deg,#4f46e5,#6366f1)'},
      dark:{'--primary':'#818cf8','--primary-hover':'#a5b4fc','--primary-soft':'rgba(129,140,248,.1)','--primary-glow':'rgba(129,140,248,.3)','--primary-gradient':'linear-gradient(135deg,#6366f1,#818cf8)'}
    },
    amber:{
      light:{'--primary':'#d97706','--primary-hover':'#b45309','--primary-soft':'rgba(217,119,6,.08)','--primary-glow':'rgba(217,119,6,.25)','--primary-gradient':'linear-gradient(135deg,#d97706,#f59e0b)'},
      dark:{'--primary':'#fbbf24','--primary-hover':'#fcd34d','--primary-soft':'rgba(251,191,36,.1)','--primary-glow':'rgba(251,191,36,.3)','--primary-gradient':'linear-gradient(135deg,#f59e0b,#fbbf24)'}
    },
    rose:{
      light:{'--primary':'#e11d48','--primary-hover':'#be123c','--primary-soft':'rgba(225,29,72,.08)','--primary-glow':'rgba(225,29,72,.25)','--primary-gradient':'linear-gradient(135deg,#e11d48,#f43f5e)'},
      dark:{'--primary':'#fb7185','--primary-hover':'#fda4af','--primary-soft':'rgba(251,113,133,.1)','--primary-glow':'rgba(251,113,133,.3)','--primary-gradient':'linear-gradient(135deg,#f43f5e,#fb7185)'}
    },
    cyan:{
      light:{'--primary':'#0891b2','--primary-hover':'#0e7490','--primary-soft':'rgba(8,145,178,.08)','--primary-glow':'rgba(8,145,178,.25)','--primary-gradient':'linear-gradient(135deg,#0891b2,#06b6d4)'},
      dark:{'--primary':'#22d3ee','--primary-hover':'#67e8f9','--primary-soft':'rgba(34,211,238,.1)','--primary-glow':'rgba(34,211,238,.3)','--primary-gradient':'linear-gradient(135deg,#06b6d4,#22d3ee)'}
    },
    violet:{
      light:{'--primary':'#7c3aed','--primary-hover':'#6d28d9','--primary-soft':'rgba(124,58,237,.08)','--primary-glow':'rgba(124,58,237,.25)','--primary-gradient':'linear-gradient(135deg,#7c3aed,#8b5cf6)'},
      dark:{'--primary':'#a78bfa','--primary-hover':'#c4b5fd','--primary-soft':'rgba(167,139,250,.1)','--primary-glow':'rgba(167,139,250,.3)','--primary-gradient':'linear-gradient(135deg,#8b5cf6,#a78bfa)'}
    }
  };
  var currentTheme='emerald';
  var isDark=false;

  /* 从 localStorage 恢复用户偏好，无记录时检测系统偏好 */
  try{
    var savedTheme=localStorage.getItem('theme-color');
    var savedDark=localStorage.getItem('theme-dark');
    if(savedTheme&&themes[savedTheme]){currentTheme=savedTheme}
    if(savedDark==='1'){isDark=true;document.documentElement.classList.add('dark')}
    else if(savedDark===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){isDark=true;document.documentElement.classList.add('dark')}
  }catch(e){}

  function applyTheme(color){
    var mode=isDark?'dark':'light';
    var vars=themes[color][mode];
    var root=document.documentElement;
    Object.keys(vars).forEach(function(key){
      root.style.setProperty(key,vars[key]);
    });
    currentTheme=color;
    try{localStorage.setItem('theme-color',color)}catch(e){}
  }

  /* 配色元数据（色块 + 名称） */
  var themeMeta={
    emerald:{color:'#2563eb',labelZh:'品牌蓝',labelEn:'Blue'},
    indigo:{color:'#4f46e5',labelZh:'靛蓝',labelEn:'Indigo'},
    amber:{color:'#d97706',labelZh:'琥珀',labelEn:'Amber'},
    rose:{color:'#e11d48',labelZh:'玫红',labelEn:'Rose'},
    cyan:{color:'#0891b2',labelZh:'青色',labelEn:'Cyan'},
    violet:{color:'#7c3aed',labelZh:'紫罗兰',labelEn:'Violet'}
  };

  /* 更新配色按钮显示 */
  function updatePickerDisplay(color){
    var meta=themeMeta[color]||themeMeta.emerald;
    var swatch=document.getElementById('currentSwatch');
    var label=document.getElementById('currentLabel');
    if(swatch)swatch.style.background=meta.color;
    if(label)label.textContent=currentLang==='en'?meta.labelEn:meta.labelZh;
    document.querySelectorAll('.theme-picker-item').forEach(function(item){
      item.classList.toggle('active',item.dataset.color===color);
    });
  }

  /* 初始化：恢复选中的配色 */
  updatePickerDisplay(currentTheme);
  /* 初始化：恢复深色图标 */
  if(isDark){
    var icon=document.getElementById('darkToggleIcon');
    if(icon)icon.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
  applyTheme(currentTheme);

  /* ============ 配色下拉选择器 ============ */
  var themePicker=document.getElementById('themePicker');
  var themePickerBtn=document.getElementById('themePickerBtn');

  themePickerBtn.addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=themePicker.classList.toggle('open');
    themePickerBtn.setAttribute('aria-expanded',isOpen?'true':'false');
  });

  document.querySelectorAll('.theme-picker-item').forEach(function(item){
    item.addEventListener('click',function(){
      var color=item.dataset.color;
      applyTheme(color);
      updatePickerDisplay(color);
      themePicker.classList.remove('open');
      themePickerBtn.setAttribute('aria-expanded','false');
    });
    item.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}
    });
  });

  /* 点击外部关闭下拉 */
  document.addEventListener('click',function(){
    themePicker.classList.remove('open');
    themePickerBtn.setAttribute('aria-expanded','false');
  });

  /* ESC 关闭下拉 */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      themePicker.classList.remove('open');
      themePickerBtn.setAttribute('aria-expanded','false');
    }
  });

  /* ============ 深色模式 ============ */
  var darkToggle=document.getElementById('darkToggle');
  var darkToggleIcon=document.getElementById('darkToggleIcon');
  darkToggle.addEventListener('click',function(){
    isDark=!isDark;
    document.documentElement.classList.toggle('dark',isDark);
    try{localStorage.setItem('theme-dark',isDark?'1':'0')}catch(e){}
    darkToggleIcon.innerHTML=isDark
      ?'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
      :'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    applyTheme(currentTheme);
  });

  /* ============ 语言切换 ============ */
  var langToggle=document.getElementById('langToggle');
  langToggle.addEventListener('click',function(){
    currentLang=currentLang==='en'?'zh':'en';
    try{localStorage.setItem('site-lang',currentLang)}catch(e){}
    if(currentLang==='en'){
      applyI18n();
      renderTimeline(currentFilter);
    }else{
      location.reload();
    }
  });

  /* ============ 更新日志数据 ============ */
  var changelogData=[
    {
      version:'v0.3.1',date:'2026-09-12',tag:'latest',badge:'latest',
      changes:{
        feature:[
          {zh:'全新 AgentKit 品牌 Logo（蓝色 AK 字母组合 + 连接节点），统一图标组件库',en:'New AgentKit brand logo (blue AK monogram + connection node) and a unified icon library'},
          {zh:'更新弹窗支持 Markdown 渲染更新日志，新增「前往官网」按钮',en:'Update dialog renders the changelog in Markdown and adds a "Visit website" button'},
          {zh:'新增 open_external_url 命令，在系统默认浏览器打开外链',en:'Added open_external_url command to open links in the system browser'}
        ],
        improve:[
          {zh:'更新体验优化：启动延迟自动检查、自定义 UI、Windows passive 安装',en:'Improved update flow: delayed auto-check, custom UI, and passive Windows install'}
        ],
        fix:[
          {zh:'修复套件同步参数不匹配与 frontmatter_extra 序列化问题',en:'Fixed suite sync parameter mismatch and frontmatter_extra serialization'},
          {zh:'修复 update_skill_source_url 返回不完整 DTO 导致的 TypeError',en:'Fixed TypeError from incomplete DTO returned by update_skill_source_url'},
          {zh:'修复更新弹窗外链在 Tauri webview 内打开的问题',en:'Fixed external links opening inside the Tauri webview'}
        ]
      }
    },
    {
      version:'v0.3.0',date:'2026-09-12',tag:'stable',badge:'stable',
      changes:{
        feature:[
          {zh:'为 trae_cn/claude_code/codex 内定提示词文件路径，新增扫描工具文件按钮',en:'Preset prompt file paths for trae_cn/claude_code/codex and added a scan tool files button'},
          {zh:'添加构建脚本自动加载签名密钥，GitHub Actions 添加 owner 限制',en:'Added a build script for signing keys and a GitHub Actions owner restriction'}
        ],
        improve:[
          {zh:'用户数据目录按资源类型重组，Skills Hub 全面替换为 AgentKit',en:'Reorganized data directories by resource type and renamed Skills Hub to AgentKit'},
          {zh:'移除官网页版本号，更新 updater 公钥',en:'Removed the site version number and updated the updater public key'}
        ]
      }
    }
  ];

  /* 版本标签文案 */
  var badgeLabels={
    latest:{zh:'最新版',en:'Latest'},
    stable:{zh:'稳定版',en:'Stable'},
    patch:{zh:'修复',en:'Patch'},
    release:{zh:'首个正式版',en:'Initial Release'},
    beta:{zh:'Beta',en:'Beta'}
  };

  /* 更新类型文案与图标 */
  var changeTypeMeta={
    feature:{zh:'新功能',en:'New Features',icon:'✨'},
    fix:{zh:'修复',en:'Bug Fixes',icon:'🐛'},
    improve:{zh:'优化',en:'Improvements',icon:'⚡'}
  };
  var typeOrder=['feature','fix','improve'];

  function getBadgeLabel(badge){
    return badgeLabels[badge]?badgeLabels[badge][currentLang]:badge;
  }
  function getChangeTypeLabel(type){
    return changeTypeMeta[type]?changeTypeMeta[type][currentLang]:type;
  }

  /* ============ 滚动揭示动画 ============ */
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});

  document.querySelectorAll('.reveal').forEach(function(el){
    observer.observe(el);
  });

  /* ============ 时间线渲染 ============ */
  var currentFilter='all';

  function renderTimeline(filter){
    var container=document.getElementById('timeline');
    container.innerHTML='';

    var filtered=filter==='all'
      ?changelogData
      :changelogData.filter(function(v){return v.tag===filter});

    if(filtered.length===0){
      var p=document.createElement('p');
      p.className='no-results';
      p.textContent=currentLang==='en'?i18nDict.en['changelog.noResults']:'未找到对应版本的更新日志。';
      container.appendChild(p);
      return;
    }

    filtered.forEach(function(v){
      var item=document.createElement('div');
      item.className='timeline-item reveal';
      item.dataset.tag=v.tag;

      var html='<div class="timeline-dot"></div>';
      html+='<div class="version-card">';
      html+='<div class="version-header">';
      html+='<span class="version-number">'+v.version+'</span>';
      html+='<span class="version-badge '+v.badge+'">'+getBadgeLabel(v.badge)+'</span>';
      html+='<span class="version-date">'+v.date+'</span>';
      html+='</div>';

      typeOrder.forEach(function(type){
        if(v.changes[type]&&v.changes[type].length>0){
          html+='<div class="change-group">';
          html+='<div class="change-group-title '+type+'">';
          html+='<span class="change-icon">'+changeTypeMeta[type].icon+'</span>';
          html+='<span>'+getChangeTypeLabel(type)+'</span>';
          html+='</div>';
          html+='<ul class="change-list '+type+'">';
          v.changes[type].forEach(function(c){
            var text=currentLang==='en'?c.en:c.zh;
            html+='<li>'+text+'</li>';
          });
          html+='</ul>';
          html+='</div>';
        }
      });

      html+='</div>';
      item.innerHTML=html;
      container.appendChild(item);

      /* 检查是否在视口内，决定立即显示还是观察滚动 */
      var rect=item.getBoundingClientRect();
      if(rect.top<window.innerHeight){
        requestAnimationFrame(function(){
          item.classList.add('visible');
        });
      }else{
        observer.observe(item);
      }
    });
  }

  /* ============ 筛选按钮 ============ */
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      currentFilter=btn.dataset.filter;
      renderTimeline(currentFilter);
    });
  });

  /* 初始渲染时间线 */
  renderTimeline(currentFilter);

  /* ============ 返回顶部 ============ */
  var scrollTopBtn=document.getElementById('scrollTop');
  window.addEventListener('scroll',function(){
    if(window.scrollY>400){
      scrollTopBtn.classList.add('visible');
    }else{
      scrollTopBtn.classList.remove('visible');
    }
  });
  scrollTopBtn.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });

})();
</script>
